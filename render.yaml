# Blueprint Render — só Web Service (API).
# Postgres: use Neon/Supabase OU o mesmo limite free do Render já usado no public-data-monitor.
# Ver docs/DEPLOY.md

services:
  - type: web
    name: job-match-alerts-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Supabase: prefira DB_* (ver docs/DEPLOY.md). Não vincule Postgres do Render aqui.
      - key: DB_HOST
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_USER
        value: postgres
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: UPLOAD_DIR
        value: /tmp/uploads
